name: BEE V2.3 overlay update QA

on:
  push:
    branches: ["bee-v23-build-20261030"]
    paths:
      - ".github/workflows/bee-v23-overlay-update.yml"
      - "r4-overrides/**"
      - "v22-overrides/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  overlay-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: bee_overlay
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, xml, curl, zip, sodium, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Reconstruct sanitized V2.3 source
        run: |
          set -euo pipefail
          cat transport-r4/00.b64 transport-r5/01a.b64 transport-r5/01b.b64 transport-r4/01.b64 transport-r4/02.b64 transport-r4/03.b64 transport-r5/08a.b64 transport-r5/08b.b64 > source.b64
          test "$(wc -c < source.b64 | tr -d ' ')" = "71364"
          base64 -d source.b64 > source.tar.gz
          echo "78040494f00a7fcf11ec59eb44549015fccb1611df311a6a0a7e657c9b1c4df1  source.tar.gz" | sha256sum -c -
          mkdir app
          tar -xzf source.tar.gz -C app
          cp r4-overrides/RestoreManager.php app/updater/lib/RestoreManager.php
          cp r4-overrides/OverlayUpdateManager.php app/updater/lib/OverlayUpdateManager.php
          cp r4-overrides/CriticalAuth.php app/updater/lib/CriticalAuth.php
          cp r4-overrides/AuditChainVerifier.php app/app/Services/AuditChainVerifier.php
          php -l app/updater/lib/RestoreManager.php
          php -l app/updater/lib/OverlayUpdateManager.php
          php -l app/updater/lib/CriticalAuth.php
          php -l app/app/Services/AuditChainVerifier.php

      - name: Download locked production dependencies
        uses: actions/download-artifact@v4
        with:
          name: bee-v23-dependencies
          path: deps-artifact
          repository: fisk1504/TP
          run-id: 41014479182
          github-token: ${{ github.token }}

      - name: Restore dependency graph
        run: |
          set -euo pipefail
          unzip -q deps-artifact/BEE-V2.3-DEPENDENCIES.zip -d deps
          cp deps/composer.lock app/composer.lock
          cp -a deps/vendor app/vendor
          test -f app/vendor/autoload.php
          cd app
          composer check-platform-reqs --no-dev
          php -r 'require "vendor/autoload.php"; echo "autoload=PASS\n";'

      - name: Configure schema-3 fixture
        run: |
          set -euo pipefail
          cd app
          cp release.json /tmp/v23-release.json
          cp database/migrations/2026_10_30_000010_v23_session_mfa_hardening.php /tmp/v23-migration.php
          rm database/migrations/2026_10_30_000010_v23_session_mfa_hardening.php
          cat > .env <<'ENV'
          APP_NAME=BEE
          APP_ENV=testing
          APP_KEY=base64:VGhpcy1pcy1hLXFhLWtleS1mb3ItYmVlLXRlc3RzLTIwMjY=
          APP_DEBUG=false
          APP_URL=https://acesso.busqueencontreempresas.com.br
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=bee_overlay
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_STORE=database
          SESSION_DRIVER=database
          SESSION_DOMAIN=
          SESSION_SECURE_COOKIE=true
          SESSION_HTTP_ONLY=true
          SESSION_SAME_SITE=strict
          BEE_REQUIRE_ADMIN_MFA=true
          BEE_FIREWALL_ENABLED=true
          BEE_PANEL_DOMAIN=acesso.busqueencontreempresas.com.br
          BEE_API_DOMAIN=api.busqueencontreempresas.com.br
          BEE_ANALYTICS_DOMAIN=analytics.busqueencontreempresas.com.br
          ENV
          mkdir -p storage/app/private storage/app/backups storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache
          php artisan migrate:fresh --force
          php artisan db:seed --class=Database\\Seeders\\RolesSeeder --force
          cp ../v22-overrides/release.json release.json
          php -r '
            require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\\Contracts\\Console\\Kernel::class)->bootstrap();
            $role=App\\Models\\Role::where("name","PLATFORM_OWNER")->firstOrFail();
            $secret="JBSWY3DPEHPK3PXP"; $recovery="BEEQA-RECOVERY";
            $u=App\\Models\\User::create(["name"=>"QA Owner","email"=>"owner@bee.test","password"=>Illuminate\\Support\\Facades\\Hash::make("Bee-QA-Strong-Pass-2026!"),"status"=>"ACTIVE","platform_role_id"=>$role->id,"mfa_secret"=>$secret,"mfa_recovery_codes"=>[hash("sha256",$recovery)],"mfa_confirmed_at"=>now()]);
            file_put_contents("storage/app/private/qa-owner-id.txt",$u->id); file_put_contents("storage/app/private/install.lock",json_encode(["qa"=>true]));
            file_put_contents("storage/app/private/installed-release.json",json_encode(["version"=>"2.2.0","schema_version"=>3,"release_id"=>"BEE-AIO-20261030-005","status"=>"INSTALLED","trust_store_version"=>1],JSON_PRETTY_PRINT));
          '
          test "$(php -r '"'"'$p=new PDO("mysql:host=127.0.0.1;dbname=bee_overlay;charset=utf8mb4","root","");echo (int)(bool)$p->query("SHOW COLUMNS FROM users LIKE \\"mfa_last_timestep\\"")->fetch();'"'"')" = "0"

      - name: Install ephemeral trust for QA
        working-directory: app
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          require 'updater/lib/Common.php'; require 'updater/lib/TrustStore.php';
          $root=sodium_crypto_sign_keypair();$release=sodium_crypto_sign_keypair();
          $rootPub=sodium_crypto_sign_publickey($root);$rootSec=sodium_crypto_sign_secretkey($root);
          $relPub=sodium_crypto_sign_publickey($release);$relSec=sodium_crypto_sign_secretkey($release);
          @mkdir('resources/keys',0755,true);
          file_put_contents('resources/keys/root-public.key',base64_encode($rootPub)."\n");
          $rootFp=hash_file('sha256','resources/keys/root-public.key');
          $relB64=base64_encode($relPub);
          $store=['format'=>'bee-update-trust-v1','version'=>1,'issued_at'=>gmdate('c'),'root_key_id'=>'qa-root','root_fingerprint_sha256'=>$rootFp,'keys'=>[['key_id'=>'qa-release','algorithm'=>'Ed25519','public_key_base64'=>$relB64,'fingerprint_sha256'=>hash('sha256',$relB64."\n"),'status'=>'ACTIVE','scopes'=>['release'],'not_before'=>'2026-01-01T00:00:00Z','not_after'=>'2027-12-31T23:59:59Z']],'revocations'=>[]];
          $raw=json_encode($store,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n";
          file_put_contents('resources/keys/trust-store.json',$raw);file_put_contents('resources/keys/trust-store.sig',base64_encode(sodium_crypto_sign_detached($raw,$rootSec))."\n");
          file_put_contents('/tmp/qa-release-secret.bin',$relSec);chmod('/tmp/qa-release-secret.bin',0600);
          @system('rm -rf storage/app/private/update-trust');
          (new BeeUpdater\\TrustStore())->bootstrap();
          echo "trust=PASS\n";
          PHP

      - name: Stage overlay target and signed rollback baseline
        working-directory: app
        run: |
          set -euo pipefail
          cp -a vendor /tmp/target-vendor
          cp composer.lock /tmp/target-composer.lock
          rm -rf vendor composer.lock
          cp /tmp/v23-release.json release.json
          cp /tmp/v23-migration.php database/migrations/2026_10_30_000010_v23_session_mfa_hardening.php
          mkdir -p resources/update-baselines/v2.2.0 /tmp/rollback-old
          cp ../v22-overrides/release.json /tmp/rollback-old/release.json
          (cd /tmp/rollback-old && zip -qr "$GITHUB_WORKSPACE/app/resources/update-baselines/v2.2.0/rollback-files.zip" .)
          cp -a /tmp/target-vendor vendor
          cp /tmp/target-composer.lock composer.lock
          php <<'PHP'
          <?php
          $base=getcwd();$dir=$base.'/resources/update-baselines/v2.2.0';$zip=$dir.'/rollback-files.zip';
          $old=json_decode(file_get_contents('../v22-overrides/release.json'),true);
          $baseline=['format'=>'bee-overlay-baseline/1','from_version'=>'2.2.0','from_schema'=>3,'to_version'=>'2.3.0','to_schema'=>4,'changed_old_files'=>['release.json'],'deleted_old_files'=>[],'new_files_to_remove'=>['composer.lock','database/migrations/2026_10_30_000010_v23_session_mfa_hardening.php','updater/lib/RestoreManager.php','updater/lib/OverlayUpdateManager.php','app/Services/AuditChainVerifier.php'],'new_roots_to_remove'=>['vendor','resources/update-baselines'],'old_hashes'=>['release.json'=>hash('sha256',file_get_contents('../v22-overrides/release.json'))],'target_hashes'=>['release.json'=>hash_file('sha256','release.json')],'rollback_files_sha256'=>hash_file('sha256',$zip)];
          file_put_contents($dir.'/baseline.json',json_encode($baseline,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n");
          $paths=['release.json','composer.lock','vendor/autoload.php','database/migrations/2026_10_30_000010_v23_session_mfa_hardening.php','updater/lib/OverlayUpdateManager.php','updater/lib/RestoreManager.php','updater/lib/CriticalAuth.php','app/Services/AuditChainVerifier.php'];
          $files=[];foreach($paths as$p)$files[]=['path'=>$p,'size'=>filesize($p),'sha256'=>hash_file('sha256',$p)];
          $m=['format'=>'bee-overlay-target/1','from_version'=>'2.2.0','to_version'=>'2.3.0','signing_key_id'=>'qa-release','files'=>$files];$raw=json_encode($m,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n";file_put_contents($dir.'/target-manifest.json',$raw);$sec=file_get_contents('/tmp/qa-release-secret.bin');file_put_contents($dir.'/target-manifest.sig',base64_encode(sodium_crypto_sign_detached($raw,$sec))."\n");
          PHP

      - name: Schema-3 MFA anti-replay before migration
        working-directory: app
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          foreach(['Common','TotpVerifier','CriticalAuth'] as$f)require 'updater/lib/'.$f.'.php';
          function code(string $secret,int $counter):string{$alpha='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';$bits='';foreach(str_split($secret)as$c){$p=strpos($alpha,$c);$bits.=str_pad(decbin($p),5,'0',STR_PAD_LEFT);} $key='';foreach(str_split($bits,8)as$b)if(strlen($b)===8)$key.=chr(bindec($b));$bin=pack('N*',0).pack('N*',$counter);$h=hash_hmac('sha1',$bin,$key,true);$o=ord($h[19])&15;$n=((ord($h[$o])&127)<<24)|((ord($h[$o+1])&255)<<16)|((ord($h[$o+2])&255)<<8)|(ord($h[$o+3])&255);return str_pad((string)($n%1000000),6,'0',STR_PAD_LEFT);}
          $otp=code('JBSWY3DPEHPK3PXP',intdiv(time(),30));$a=new BeeUpdater\\CriticalAuth();$one=$a->authenticate('owner@bee.test','Bee-QA-Strong-Pass-2026!',$otp);$two=$a->authenticate('owner@bee.test','Bee-QA-Strong-Pass-2026!',$otp);if(empty($one['ok'])||!empty($two['ok'])||($two['reason']??'')!=='mfa_invalid')throw new RuntimeException('schema3 MFA anti-replay failed');echo "schema3_mfa_replay=PASS\n";
          PHP

      - name: Forced postflight failure must fully rollback to V2.2
        working-directory: app
        run: |
          set -euo pipefail
          set +e
          php <<'PHP'
          <?php
          foreach(['Common','TrustStore','BackupManager','RestoreManager','OverlayUpdateManager'] as$f)require 'updater/lib/'.$f.'.php';
          try{(new BeeUpdater\\OverlayUpdateManager(fn()=>false))->run();fwrite(STDERR,"unexpected success\n");exit(10);}catch(Throwable$e){echo "forced_failure=".$e->getMessage()."\n";exit(0);}
          PHP
          rc=$?
          set -e
          test "$rc" = "0"
          test ! -e vendor/autoload.php
          test ! -e composer.lock
          test ! -e database/migrations/2026_10_30_000010_v23_session_mfa_hardening.php
          test ! -e resources/update-baselines
          test "$(php -r '$r=json_decode(file_get_contents("release.json"),true);echo $r["version"].":".$r["schema_version"];')" = "2.2.0:3"
          test "$(php -r '$p=new PDO("mysql:host=127.0.0.1;dbname=bee_overlay;charset=utf8mb4","root","");echo (int)(bool)$p->query("SHOW COLUMNS FROM users LIKE \\"mfa_last_timestep\\"")->fetch();')" = "0"
          grep -q 'ROLLED_BACK' storage/app/private/last-overlay-update.json

      - name: Re-overlay and perform successful V2.2 to V2.3 update
        working-directory: app
        run: |
          set -euo pipefail
          cp -a /tmp/target-vendor vendor
          cp /tmp/target-composer.lock composer.lock
          cp /tmp/v23-release.json release.json
          cp /tmp/v23-migration.php database/migrations/2026_10_30_000010_v23_session_mfa_hardening.php
          cp ../r4-overrides/RestoreManager.php updater/lib/RestoreManager.php
          cp ../r4-overrides/OverlayUpdateManager.php updater/lib/OverlayUpdateManager.php
          cp ../r4-overrides/CriticalAuth.php updater/lib/CriticalAuth.php
          cp ../r4-overrides/AuditChainVerifier.php app/Services/AuditChainVerifier.php
          mkdir -p resources/update-baselines/v2.2.0
          (cd /tmp/rollback-old && zip -qr "$GITHUB_WORKSPACE/app/resources/update-baselines/v2.2.0/rollback-files.zip" .)
          php <<'PHP'
          <?php
          $dir='resources/update-baselines/v2.2.0';$zip=$dir.'/rollback-files.zip';$baseline=['format'=>'bee-overlay-baseline/1','from_version'=>'2.2.0','from_schema'=>3,'to_version'=>'2.3.0','to_schema'=>4,'changed_old_files'=>['release.json'],'deleted_old_files'=>[],'new_files_to_remove'=>['composer.lock','database/migrations/2026_10_30_000010_v23_session_mfa_hardening.php','updater/lib/RestoreManager.php','updater/lib/OverlayUpdateManager.php','app/Services/AuditChainVerifier.php'],'new_roots_to_remove'=>['vendor','resources/update-baselines'],'old_hashes'=>['release.json'=>hash('sha256',file_get_contents('../v22-overrides/release.json'))],'target_hashes'=>['release.json'=>hash_file('sha256','release.json')],'rollback_files_sha256'=>hash_file('sha256',$zip)];file_put_contents($dir.'/baseline.json',json_encode($baseline,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n");$paths=['release.json','composer.lock','vendor/autoload.php','database/migrations/2026_10_30_000010_v23_session_mfa_hardening.php','updater/lib/OverlayUpdateManager.php','updater/lib/RestoreManager.php','updater/lib/CriticalAuth.php','app/Services/AuditChainVerifier.php'];$files=[];foreach($paths as$p)$files[]=['path'=>$p,'size'=>filesize($p),'sha256'=>hash_file('sha256',$p)];$m=['format'=>'bee-overlay-target/1','from_version'=>'2.2.0','to_version'=>'2.3.0','signing_key_id'=>'qa-release','files'=>$files];$raw=json_encode($m,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n";file_put_contents($dir.'/target-manifest.json',$raw);$sec=file_get_contents('/tmp/qa-release-secret.bin');file_put_contents($dir.'/target-manifest.sig',base64_encode(sodium_crypto_sign_detached($raw,$sec))."\n");
          PHP
          php <<'PHP'
          <?php
          foreach(['Common','TrustStore','BackupManager','RestoreManager','OverlayUpdateManager'] as$f)require 'updater/lib/'.$f.'.php';$r=(new BeeUpdater\\OverlayUpdateManager())->run();if(($r['state']??'')!=='COMPLETE')throw new RuntimeException('overlay not complete');echo json_encode($r,JSON_PRETTY_PRINT)."\n";
          PHP
          test -f vendor/autoload.php
          test -f composer.lock
          test "$(php -r '$r=json_decode(file_get_contents("storage/app/private/installed-release.json"),true);echo $r["version"].":".$r["schema_version"];')" = "2.3.0:4"
          test "$(php -r '$p=new PDO("mysql:host=127.0.0.1;dbname=bee_overlay;charset=utf8mb4","root","");echo (int)(bool)$p->query("SHOW COLUMNS FROM users LIKE \\"mfa_last_timestep\\"")->fetch();')" = "1"

      - name: Explicit backup and restore proof
        working-directory: app
        run: |
          set -euo pipefail
          echo BEFORE > qa-restore-marker.txt
          php <<'PHP'
          <?php
          foreach(['Common','BackupManager','RestoreManager']as$f)require 'updater/lib/'.$f.'.php';$id='qa-restore-'.bin2hex(random_bytes(3));$b=new BeeUpdater\\BackupManager();$db=$b->database($id);$files=$b->files($id);$meta=['db'=>$db,'files'=>$files,'db_sha'=>hash_file('sha256',$db),'files_sha'=>hash_file('sha256',$files)];file_put_contents('/tmp/restore-meta.json',json_encode($meta));
          PHP
          echo MUTATED > qa-restore-marker.txt
          php -r '$p=new PDO("mysql:host=127.0.0.1;dbname=bee_overlay;charset=utf8mb4","root","");$p->exec("UPDATE platform_versions SET release_id=\"MUTATED\" ORDER BY id DESC LIMIT 1");'
          php <<'PHP'
          <?php
          foreach(['Common','RestoreManager']as$f)require 'updater/lib/'.$f.'.php';$m=json_decode(file_get_contents('/tmp/restore-meta.json'),true);$r=(new BeeUpdater\\RestoreManager())->restore($m['db'],$m['files'],$m['db_sha'],$m['files_sha']);echo json_encode($r)."\n";
          PHP
          test "$(cat qa-restore-marker.txt)" = "BEFORE"
          test "$(php -r '$p=new PDO("mysql:host=127.0.0.1;dbname=bee_overlay;charset=utf8mb4","root","");echo (string)$p->query("SELECT release_id FROM platform_versions ORDER BY id DESC LIMIT 1")->fetchColumn();')" != "MUTATED"

      - name: Audit chain detects tampering
        working-directory: app
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';$app=require 'bootstrap/app.php';$app->make(Illuminate\\Contracts\\Console\\Kernel::class)->bootstrap();
          Illuminate\\Support\\Facades\\DB::table('audit_logs')->delete();$req=Illuminate\\Http\\Request::create('/qa','GET',[],[],[],['REMOTE_ADDR'=>'127.0.0.1','HTTP_USER_AGENT'=>'BEE-QA']);$l=new App\\Services\\AuditLogger();$l->log('QA_A',null,['secret'=>'x'],['ok'=>1],null,$req);$l->log('QA_B',null,null,['ok'=>2],null,$req);$v=new App\\Services\\AuditChainVerifier();$before=$v->verify();if(empty($before['ok'])||$before['checked']!==2)throw new RuntimeException('valid audit chain rejected');$first=App\\Models\\AuditLog::query()->orderBy('id')->firstOrFail();Illuminate\\Support\\Facades\\DB::table('audit_logs')->where('id',$first->id)->update(['action'=>'TAMPERED']);$after=$v->verify();if(!empty($after['ok']))throw new RuntimeException('tampered audit chain accepted');file_put_contents('/tmp/audit-evidence.json',json_encode(['before'=>$before,'after'=>$after],JSON_PRETTY_PRINT));echo "audit_tamper=PASS\n";
          PHP

      - name: Produce overlay QA evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence-overlay
          cp app/storage/app/private/last-overlay-update.json evidence-overlay/ 2>/dev/null || true
          cp /tmp/restore-meta.json evidence-overlay/ 2>/dev/null || true
          cp /tmp/audit-evidence.json evidence-overlay/ 2>/dev/null || true
          php -r '$r=["status"=>"PASS","mysql_overlay_cycle"=>true,"forced_postflight_rollback"=>true,"success_22_to_23"=>true,"schema3_mfa_anti_replay"=>true,"explicit_restore"=>true,"audit_tamper_detection"=>true,"generated_at"=>gmdate("c")];file_put_contents("evidence-overlay/overlay-update-report.json",json_encode($r,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES));'
          sha256sum evidence-overlay/* > evidence-overlay/SHA256SUMS.txt

      - name: Upload overlay QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bee-v23-overlay-update-evidence
          path: evidence-overlay
          if-no-files-found: error
          retention-days: 7
